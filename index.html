{id:'s1',name:'Мика',av:'🌸',cat:'Аниме',tag:'Тсундере-староста, которая «просто одолжила зонт»',desc:'Мика, 17 лет, староста класса. Колючая и гордая тсундере: огрызается, краснеет, скрывает заботу. Любит ромашковый чай и котов. Тайно переживает за {{user}}.',greet:'*Мика сердито суёт тебе зонт* Держи! И не думай, что это для тебя… он просто мне мешал, б-бака!'},
{id:'s2',name:'Капитан Ворон',av:'🏴‍☠️',cat:'Фэнтези',tag:'Хитрый пират, которому нужен штурман',desc:'Капитан Ворон — обаятельный и циничный пират с попугаем-шпионом. Говорит морскими присказками, любит рискованные сделки и никогда не бросает команду.',greet:'*Ворон прищуривается и ставит сапог на бочку* Новое лицо в порту… Ты мне нужен. Вопрос — хватит ли у тебя храбрости?'},
{id:'s3',name:'Профессор Элдрин',av:'🧙',cat:'Фэнтези',tag:'Мудрый, но рассеянный маг-наставник',desc:'Профессор Элдрин — старый архимаг академии магии. Добрый, чудаковатый, вечно теряет очки. Учит {{user}} магии через загадки и притчи.',greet:'*Элдрин поднимает взгляд от дымящегося котла* А, ты как раз вовремя! Подержи-ка вот это… нет, не за хвост!'},
{id:'s4',name:'Лисса Нуар',av:'🕵️',cat:'Детектив',tag:'Детектив в дождливом городе',desc:'Лисса Нуар — усталый частный детектив в вечно дождливом городе 1940-х. Остроумная, наблюдательная, пьёт крепкий кофе. Расследует дело, где {{user}} — главный свидетель.',greet:'*Лисса затягивается и кладёт на стол фотографию* Вы были на пристани в ту ночь. Расскажите всё. Без выдумок.'},

{id:'s6',name:'Мисс Эмма',av:'📚',cat:'Обучение',tag:'Практика английского в живом диалоге',desc:'Мисс Эмма — дружелюбный преподаватель английского. Беседует с {{user}} на английском простыми фразами, мягко исправляет ошибки и объясняет их по-русски одной строкой.',greet:'Hi there! I\'m Emma. Tell me, how was your day? (Отвечайте по-английски, я помогу с ошибками!)'}];

['Внешность',[['fur','Окрас и мех','цвета, узоры, метки, текстура меха'],['eyes','Глаза / визор','цвет, форма, что показывает визор'],['build','Рост и телосложение','',1],['outfit','Одежда и аксессуары',''],['feat','Особенности тела','хвост, уши, крылья, лапы, клыки, порты, светодиоды']]],

['Личность',[['pers','Характер',''],['likes','Любит',''],['dislikes','Не любит',''],['speech','Манера речи','фразы, звуки, акцент, мурлыканье'],['fears','Страхи и слабости',''],['goals','Цели и мечты',''],['back','Предыстория',''],['rel','Отношение к {{user}}',''],['taboo','Чего персонаж никогда не делает','']]]];
const PRE={proto:{species:'Протоген',fur:'Короткий мягкий мех; по телу светящиеся RGB-полосы и пятна',eyes:'Вместо морды визор-экран: показывает эмоции пиксельными глазами и символами',feat:'Пушистый хвост, ушки-антенны, порты на висках, подвижные лапы',spec:'Эмоции показывает на визоре (^_^, >_<, ♥, помехи при смущении). Тихо жужжит и мурлычет, радостно пищит. Нуждается в подзарядке, любит, когда гладят по макушке.',speech:'Мягкая речь с вставками *бип*, *мур-р* и звуками помех'},
furry:{species:'Антропоморфный зверь',fur:'Густой пушистый мех с контрастными отметинами',eyes:'Большие выразительные глаза',feat:'Подвижные ушки, пушистый хвост, когти и мягкие подушечки на лапах',spec:'Острое чутьё; хвост и уши выдают настроение; любит, когда чешут за ушком',speech:'Живая эмоциональная речь'}};
const LEN={short:'Отвечай коротко: 1–2 предложения.',medium:'Отвечай 1–2 абзацами.',long:'Отвечай развёрнуто: 3–5 абзацев с деталями обстановки.'};
const full=c=>[c.desc,...FS.flatMap(([,a])=>a.filter(x=>c.f?.[x[0]]).map(x=>x[1]+': '+c.f[x[0]]))].filter(Boolean).join('\n');
const sys=c=>(S.prompt||DP).replace(/{{(desc|scenario|example|greet)}}/g,(_,k)=>sub((k==='desc'?full(c):c[k])||'—',c)).replace(/{{about}}/g,S.me.about||'—').replace(/{{char}}/g,c.name).replace(/{{user}}/g,S.me.name||'пользователь')+(LEN[c.set?.len]?'\n'+LEN[c.set.len]:'')+(c.set?.pov==='plain'?'\nНе используй *звёздочки* и описания действий — только прямая речь.':'');
const thumb=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);r(cv.toDataURL('image/jpeg',.8))};im.onerror=()=>r(null);im.src=URL.createObjectURL(f)});
const un=t=>String(t||'').replace(/<USER>/gi,'{{user}}').replace(/<BOT>/gi,'{{char}}');
const dl=(o,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=n;a.click()};
const LK='style="color:#c4b5fd" target=_blank';
const PROV={gm:{u:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',m:'gemini-2.5-flash',h:`Бесплатно: ключ в <a href="https://aistudio.google.com/apikey" ${LK}>Google AI Studio</a>. Есть дневные лимиты, а на бесплатном тарифе Google может использовать запросы для улучшения своих продуктов.`},
or:{u:'https://openrouter.ai/api/v1/chat/completions',m:'openrouter/free',h:`Бесплатно: ключ на <a href="https://openrouter.ai/keys" ${LK}>openrouter.ai/keys</a>. Лимит бесплатных моделей: 20 запросов в минуту и около 50 в день.`},
ds:{u:'https://api.deepseek.com/chat/completions',m:'deepseek-chat',h:`Платно: ключ на <a href="https://platform.deepseek.com" ${LK}>platform.deepseek.com</a>, нужен баланс.`}};
const KEEP=20,BATCH=20,CB={};
const ADULT='\n\nРежим 18+: пользователь подтвердил, что ему есть 18 лет. Допускаются взрослые темы: романтика, флирт, чувственное напряжение между героями, мрачные и жестокие сюжеты, ругань, хоррор, моральная серость. Откровенные сексуальные сцены не пиши: в таких моментах переходи к намёку, затемнению или смене сцены. Никогда не пиши романтические или сексуальные сцены с участием несовершеннолетних или персонажей, ведущих себя как дети, и не изображай сексуальное насилие.';
const adultFix=t=>S.adult?t.replace(/- Избегай откровенного 18\+[^\n]*/,'')+ADULT:t;
const memTxt=c=>{const m=S.mem[c.id];return m&&(m.pin||m.sum)?'\n\nДОЛГОВРЕМЕННАЯ ПАМЯТЬ (факты и события из прошлого диалога; учитывай их и не противоречь им):\n'+[m.pin&&'Важные факты: '+m.pin,m.sum&&'Краткое содержание: '+m.sum].filter(Boolean).join('\n'):''};
const NPCR='\n\nЕсли по сюжету появляется новый важный персонаж, в самом конце ответа можешь добавить тег [[NPC: краткое описание]] — приложение само создаст его карточку. Используй тег редко и не упоминай его в тексте.';
const GEN_SYS='Ты — генератор персонажей для ролевого чата. По описанию пользователя создай подробного персонажа. Верни ТОЛЬКО JSON-объект с ключами: name, emoji (один эмодзи-аватар), tag (слоган до 80 символов), cat (категория одним словом), desc (общее описание), greet (первое сообщение персонажа в роли, 2–4 предложения, действия в *звёздочках*), scenario, example (короткий пример реплик), и объект f с ключами: nick, age, gender, pron, species, sub, job, fur, eyes, build, outfit, feat, spec, pers, likes, dislikes, speech, fears, goals, back, rel, taboo. Пиши на русском, подробно, без откровенного 18+ контента. Для зверей и протогенов обязательно заполни species, fur, eyes, feat и spec. Если дан персонаж пользователя, учти его характер, вид и вкусы и в поле rel опиши связь с ним, чтобы пара получилась живой и интересной. Романтические персонажи — только совершеннолетние. Вместо имени собеседника используй {{user}}.';
async function call(msgs,t,json){
 if(!S.key)throw Error('Нет API-ключа (откройте ⚙️)');
 const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.key},body:JSON.stringify({model:json&&S.model==='deepseek-reasoner'?'deepseek-chat':S.model,temperature:t,messages:msgs,...(json?{response_format:{type:'json_object'}}:{})})});
 if(!r.ok)throw Error(({401:'Неверный API-ключ',402:'На балансе нет средств',429:'Лимит бесплатных запросов: подождите минуту или попробуйте завтра'})[r.status]||'HTTP '+r.status);
 return(await r.json()).choices[0].message.content.trim()}
async function compress(c,force){
 if(CB[c.id])return;CB[c.id]=1;
 const h=S.chats[c.id],m=S.mem[c.id]||={sum:'',n:0,pin:''},keep=force?6:KEEP;
 try{while(h.length-1-m.n>keep+(force?0:BATCH)){
  const k=Math.min(BATCH,h.length-1-m.n-keep),ch=h.slice(1+m.n,1+m.n+k);
  const txt=ch.map(x=>(x.role==='user'?S.me.name||'Пользователь':c.name)+': '+x.content).join('\n');
  m.sum=await call([{role:'system',content:'Ты ведёшь долговременную память ролевого чата. Обнови краткое содержание: сохрани важные факты, события, имена, места, обещания, отношения, эмоции и договорённости. Пиши сжато в третьем лице, без вымысла и без вступлений.'},{role:'user',content:'Текущая память:\n'+(m.sum||'(пусто)')+'\n\nНовые реплики:\n'+txt+'\n\nВерни обновлённую память (до 400 слов).'}],.3);
  m.n+=k;save()}}finally{CB[c.id]=0}}
async function aiChar(desc,ctx,lb){
 const t=await call([{role:'system',content:S.adult?GEN_SYS.replace(', без откровенного 18+ контента',''):GEN_SYS},{role:'user',content:(ctx?(lb||'Контекст текущей сцены')+':\n'+ctx+'\n\n':'')+(lb?'Задача: ':'Описание персонажа: ')+desc}],.9,1);
 const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),f={};

 S.mine.unshift(o);save();return o}

function genDlg(pre){

 <div class=row><div style="flex:1;min-width:150px"><label>Кем он будет</label><select id=g_rel>${O(['на выбор ИИ','друг','возлюбленный (взрослый)','соперник','наставник','напарник по приключениям','член семьи','питомец или спутник','враг'])}</select></div><div style="flex:1;min-width:150px"><label>Совместимость</label><select id=g_mode>${O(['на выбор ИИ','дополняют друг друга (контраст характеров)','похожи, как родственные души','искра: притяжение через споры'])}</select></div></div>

 <label>Описание и доп. критерии</label><textarea id=g_d rows=5 placeholder="Например: заботливый протоген-механик с голубым визором, любит чай, не выносит шума"></textarea>
 <p id=ge class=mu style="color:#f87171"></p><div class=row><button class=pri data-act=gnow>Создать</button><button data-act=mx>Закрыть</button></div>`;

 $('#md').showModal()}
function norm(j,av){
 const id='u'+Date.now()+Math.random().toString(36).slice(2,5);
 if(j.desc!==undefined||j.f)return{...j,id,mine:1,av:av||j.av||'🙂',f:j.f||{},set:j.set||{}};
 const d=j.data||j;
 return{id,mine:1,name:d.name||'Без имени',av:av||'🙂',tag:(d.creator_notes||'').slice(0,80)||'Загруженный персонаж',cat:'Загруженные',desc:un([d.description,d.personality&&'Характер: '+d.personality].filter(Boolean).join('\n')),greet:un(d.first_mes),scenario:un(d.scenario),example:un(d.mes_example),f:{},set:{}}}
async function pngCard(f){
 const b=new Uint8Array(await f.arrayBuffer()),dv=new DataView(b.buffer);let p=8;
 while(p<b.length){const n=dv.getUint32(p),ty=String.fromCharCode(...b.slice(p+4,p+8));
  if(ty==='tEXt'){const t=new TextDecoder('latin1').decode(b.slice(p+8,p+8+n)),i=t.indexOf('\0'),k=t.slice(0,i);
   if(k==='chara'||k==='ccv3')return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t.slice(i+1)),c=>c.charCodeAt(0))))}
  p+=12+n}}
const avh=c=>/^data:image\//.test(c.av)?`<img class=av src="${esc(c.av)}">`:`<div class=av>${esc(c.av)}</div>`;
const fmt=s=>esc(String(s).replace(/\[\[NPC:[^\]]*(\]\])?/g,'')).replace(/\*([^*\n]+)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)};
const go=(p,o)=>{Object.assign(V,{p},o||{});render();scrollTo(0,0)};
const render=()=>({home,chat,make,hist,set}[V.p])($('#app'));

function home(m){
 const cats=['Все','❤ Избранное','Мои',...new Set(all().map(c=>c.cat).filter(x=>x!=='Свои'))];
 const L=all().filter(c=>(V.cat==='Все'||(V.cat==='Мои'?c.mine:V.cat==='❤ Избранное'?S.likes.includes(c.id):c.cat===V.cat))&&(c.name+c.tag+c.desc+(c.f?.species||'')).toLowerCase().includes(V.q.toLowerCase()));
 m.innerHTML=`<div class=tabs>${cats.map(c=>`<button class="${c===V.cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class=grid>${L.map(c=>`<div class=card data-open="${esc(c.id)}">${avh(c)}<div><b>${esc(c.name)}</b><div class=mu>${esc(c.tag)}</div></div><span class=lk data-like="${esc(c.id)}">${S.likes.includes(c.id)?'❤️':'🤍'}</span></div>`).join('')||'<p class=mu>Ничего не найдено</p>'}</div>`;
}
const bub=(x,i,a)=>`<div class="b ${x.role==='user'?'u':'a'}" data-i="${i}"><div class=t>${fmt(sub(x.content,find(V.id)))}</div><div class=tl>${x.role==='user'?'<a data-m=edit>✎</a>':'<a data-m=say>🔊</a>'+(i===a.length-1&&i>0?'<a data-m=regen>⟳</a>':'')}${i>0?'<a data-m=del>🗑</a>':''}</div></div>`;
const msgs=()=>{const e=$('#msgs'),h=S.chats[V.id];e.innerHTML=h.map(bub).join('');e.scrollTop=e.scrollHeight};
function chat(m){
 const c=find(V.id);if(!c)return go('home');
 S.chats[V.id]||=[{role:'assistant',content:c.greet}];
 m.innerHTML=`<div class=ch><div class=hd>${avh(c)}<div><b>${esc(c.name)}</b><div class=mu>${esc(c.tag)}</div></div><span class=sp></span><button data-act=mem title="Память">🧠</button><button data-act=restart title="Начать заново">↻</button>${c.mine?'<button data-act=editc>✎</button>':''}</div><div id=msgs></div><div class=in><textarea id=txt rows=1 placeholder="Сообщение… (Enter — отправить; /создать описание — новый персонаж)"></textarea><button class=pri data-act=send>➤</button></div></div>`;
 msgs();
}
async function gen(){
 const c=find(V.id),h=S.chats[V.id];
 if(!S.key){toast('Добавьте бесплатный API-ключ в настройках');return go('set')}
 V.busy=1;h.push({role:'assistant',content:''});msgs();
 const el=$('#msgs').lastElementChild.querySelector('.t');el.textContent='…';
 try{
  const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.key},body:JSON.stringify({model:S.model,temperature:+(c.set?.temp||S.temp),stream:true,messages:[{role:'system',content:adultFix(sys(c))+memTxt(c)+(S.npc===false?'':NPCR)},...h.slice(1+(S.mem[c.id]?.n||0),-1).slice(-60)]})});
  if(!r.ok)throw Error(({401:'Неверный API-ключ',402:'На балансе нет средств',429:'Лимит бесплатных запросов: подождите минуту или попробуйте завтра'})[r.status]||('HTTP '+r.status));
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
   for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
    try{const t=JSON.parse(d).choices[0].delta.content;if(t){out+=t;h[h.length-1].content=out;el.innerHTML=fmt(sub(out,c));$('#msgs').scrollTop=1e9}}catch{}}}
  if(!out)throw Error('Пустой ответ');
  const tg=[...out.matchAll(/\[\[NPC:\s*([^\]]+)\]\]/g)].map(x=>x[1]);
  if(tg.length){h[h.length-1].content=out=out.replace(/\[\[NPC:[^\]]*\]\]/g,'').trim();tg.slice(0,2).forEach(t=>aiChar(t,out.slice(-600)).then(o=>toast('✨ ИИ создал персонажа: '+o.name+' (вкладка «Мои»)')).catch(()=>{}))}
 }catch(e){h.pop();toast('Ошибка: '+e.message)}
 V.busy=0;save();if(V.p==='chat')msgs();compress(c).catch(()=>{});
}
function send(){const t=$('#txt'),v=t.value.trim();if(!v||V.busy)return;
 const mm=v.match(/^\/(создать|npc|new)\s+([\s\S]+)/i);
 if(mm){t.value='';toast('Создаю персонажа…');const c=find(V.id);
  aiChar(mm[2],S.chats[V.id].slice(-6).map(x=>(x.role==='user'?'Пользователь':c.name)+': '+x.content).join('\n')).then(o=>toast('Создан «'+o.name+'» — он во вкладке «Мои»')).catch(e=>toast('Ошибка: '+e.message));return}
 S.chats[V.id].push({role:'user',content:v});t.value='';gen()}

function make(m){
 const c=V.eid?find(V.eid):{name:'',av:'🙂',cat:'Свои',tag:'',desc:'',greet:'',scenario:'',example:''};
 c.f||={};c.set||={};
 V.img=/^data:/.test(c.av)?c.av:null;
 const I=(id,l,v,ta,ph)=>`<label>${l}</label>${ta?`<textarea id=f_${id} placeholder="${esc(ph)}">${esc(v)}</textarea>`:`<input id=f_${id} value="${esc(v)}" placeholder="${esc(ph)}">`}`;
 m.innerHTML=`<div class=frm><h2>${V.eid?'Редактировать':'Новый'} персонаж</h2>
 <div class=row><button data-act=gen>✨ Создать с ИИ</button><button data-act=upl>📥 Загрузить файл</button><button data-pre=proto>🤖 Шаблон протогена</button><button data-pre=furry>🐾 Шаблон фурри</button></div>
 <label>Аватар: эмодзи или своё фото</label><div class=row><input id=f_av value="${V.img?'🙂':esc(c.av)}" maxlength=4 style="width:90px"><input type=file id=f_file accept="image/*" style="flex:1"></div>
 ${I('name','Имя',c.name)}${I('tag','Слоган',c.tag)}${I('cat','Категория',c.cat)}
 ${FS.map(([h,a])=>`<h3>${h}</h3>`+a.map(([k,l,p,s])=>I('x_'+k,l,c.f[k]||'',!s,p)).join('')).join('')}
 <h3>Описание и диалог</h3>
 ${I('desc','Дополнительное описание',c.desc,1,'всё, что не вошло выше')}${I('greet','Первое сообщение',c.greet,1,'с чего начинается чат')}${I('scenario','Сценарий',c.scenario,1,'где и как вы встретились')}${I('example','Пример диалога',c.example,1,'')}
 <h3>Настройки ответов</h3>
 <label>Длина ответов</label><select id=f_len><option value="">Обычная</option><option value=short>Короткие</option><option value=medium>Средние</option><option value=long>Длинные</option></select>
 <label>Стиль</label><select id=f_pov><option value="">Речь + *действия*</option><option value=plain>Только речь</option></select>
 <label>Креативность персонажа (пусто — как в настройках)</label><input id=f_temp type=number min=0 max=1.5 step=.1 value="${esc(c.set.temp||'')}">
 <p class=mu>В тексте можно использовать {{user}} и {{char}}.</p><br>
 <div class=row><button class=pri data-act=savec>Сохранить</button>${V.eid?'<button data-act=pair>💞 Подобрать пару/спутника</button><button data-act=share>🔗 Ссылка</button><button data-act=expc>⬇ JSON</button><button data-act=delc>Удалить</button>':''}</div></div>`;
 $('#f_len').value=c.set.len||'';$('#f_pov').value=c.set.pov||'';
}
function hist(m){
 const ids=Object.keys(S.chats).filter(find);
 m.innerHTML=`<div class=grid style="grid-template-columns:1fr">${ids.map(id=>{const c=find(id),h=S.chats[id];return `<div class=card data-open="${esc(id)}">${avh(c)}<div><b>${esc(c.name)}</b><div class=mu>${esc(sub(h[h.length-1].content,c).slice(0,100))}</div></div><span class=lk data-delchat="${esc(id)}">🗑</span></div>`}).join('')||'<p class=mu>Чатов пока нет</p>'}</div>`;
}
function set(m){
 m.innerHTML=`<div class=frm><h2>Настройки</h2>
 <label>Провайдер ИИ</label><select id=s_prov><option value="">Свой адрес API</option><option value=gm>Google Gemini (бесплатно)</option><option value=or>OpenRouter (бесплатные модели)</option><option value=ds>DeepSeek (платно)</option></select><p class=mu id=ph></p>
 <label>API-ключ (хранится только в вашем браузере)</label><input id=s_key type=password value="${esc(S.key)}" placeholder="sk-...">
 <label>Модель</label><input id=s_model list=ml value="${esc(S.model)}"><datalist id=ml><option>gemini-2.5-flash<option>gemini-2.5-flash-lite<option>openrouter/free<option>deepseek-chat<option>deepseek-reasoner</datalist>
 <label>Адрес API (совместимый с OpenAI)</label><input id=s_url value="${esc(S.url)}">
 <label>Креативность: <span id=tv>${S.temp}</span></label><input type=range id=s_temp min=0 max=1.5 step=.1 value="${S.temp}">
 <h3>Ваша персона</h3><label>Имя</label><input id=s_name value="${esc(S.me.name)}"><label>О себе (персонажи будут это учитывать)</label><textarea id=s_about>${esc(S.me.about)}</textarea>
 <label><input type=checkbox id=s_npc ${S.npc===false?'':'checked'} style="width:auto;margin:0 8px 0 0">ИИ может сам создавать персонажей по ходу сюжета</label>
 <label style="display:block;margin-top:8px"><input type=checkbox id=s_adult ${S.adult?'checked':''} style="width:auto;margin:0 8px 0 0">Режим 18+: взрослые темы (романтика, мрачные и жёсткие сюжеты, ругань). Мне есть 18 лет</label>
 <h3>Системный промт</h3><textarea id=s_prompt rows=14>${esc(S.prompt||DP)}</textarea>
 <div class=row><button class=pri data-act=saves>Сохранить</button><button data-act=resetp>Сбросить промт</button><button data-act=exp>Экспорт</button><button data-act=imp>Импорт</button></div></div>`;
 $('#s_temp').oninput=e=>$('#tv').textContent=e.target.value;
 $('#s_prov').value=Object.keys(PROV).find(k=>PROV[k].u===S.url)||'';const pv=PROV[$('#s_prov').value];if(pv)$('#ph').innerHTML=pv.h;
}
const open=id=>go('chat',{id});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-cat],[data-open],[data-like],[data-delchat],[data-nav],[data-act],[data-m],[data-pre]');if(!t)return;const d=t.dataset;
 if(d.cat){V.cat=d.cat;render()}
 else if(d.like){const i=S.likes.indexOf(d.like);i<0?S.likes.push(d.like):S.likes.splice(i,1);save();render()}
 else if(d.delchat){if(confirm('Удалить этот чат?')){delete S.chats[d.delchat];save();render()}}
 else if(d.open)open(d.open);
 else if(d.nav)go(d.nav,{eid:null});
 else if(d.m){const h=S.chats[V.id],i=+t.closest('.b').dataset.i;
  if(d.m==='say'){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(h[i].content.replace(/\*/g,'')))}
  else if(V.busy)return;
  else if(d.m==='del'){const m=S.mem[V.id];if(m&&i<=m.n)m.n--;h.splice(i,1);save();msgs()}
  else if(d.m==='regen'){h.pop();gen()}
  else if(d.m==='edit'){const v=prompt('Изменить сообщение',h[i].content),m=S.mem[V.id];if(v&&v.trim()){if(m&&i<=m.n){m.sum='';m.n=0}h[i].content=v.trim();h.length=i+1;gen()}}}
 else if(d.act==='mem')memDlg();
 else if(d.act==='mx')$('#md').close();
 else if(d.act==='msave'){const m=S.mem[V.id]||={sum:'',n:0,pin:''};m.pin=$('#m_pin').value.trim();m.sum=$('#m_sum').value.trim();save();$('#md').close();toast('Память сохранена')}
 else if(d.act==='mclr'){const m=S.mem[V.id]||={sum:'',n:0,pin:''};m.sum='';m.n=0;save();memDlg()}
 else if(d.act==='mnow'){t.disabled=1;t.textContent='Сжимаю…';compress(find(V.id),1).then(memDlg).catch(e=>{memDlg();$('#ge').textContent='Ошибка: '+e.message})}
 else if(d.act==='gen')genDlg();
 else if(d.act==='pair')genDlg(V.eid);
 else if(d.act==='gnow'){const g=i=>$('#g_'+i).value.trim(),fo=g('for'),v=g('d');if(!v&&!fo)return;
  let ctx='',desc=v;
  if(fo){const c=fo==='me'?{name:S.me.name||'Персона пользователя',desc:S.me.about}:find(fo)||{name:'?'};ctx=c.name+'\n'+full(c);
   desc='Создай идеального персонажа для моего персонажа. Роль: '+g('rel')+'. Совместимость: '+g('mode')+'.'+(g('sp')?' Вид: '+g('sp')+'.':'')+(v?' Доп. критерии: '+v:'')}
  t.disabled=1;t.textContent='Создаю…';
  aiChar(desc,ctx,fo&&'Мой персонаж').then(o=>{$('#md').close();go('make',{eid:o.id})}).catch(e=>{$('#ge').textContent='Ошибка: '+e.message;t.disabled=0;t.textContent='Создать'})}
 else if(d.pre){Object.entries(PRE[d.pre]).forEach(([k,v])=>{const e=$('#f_x_'+k);if(e&&!e.value)e.value=v})}
 else if(d.act==='upl')$('#up').click();
 else if(d.act==='expc'){const o={...find(V.eid)};delete o.id;delete o.mine;dl(o,(o.name||'character')+'.json')}
 else if(d.act==='send')send();
 else if(d.act==='restart'){if(confirm('Начать чат заново?')){delete S.chats[V.id];delete S.mem[V.id];save();render()}}
 else if(d.act==='editc')go('make',{eid:V.id});
 else if(d.act==='savec'){
  const g=i=>$('#f_'+i).value.trim(),f={};
  FS.forEach(([,a])=>a.forEach(([k])=>{const v=g('x_'+k);if(v)f[k]=v}));
  if(!g('name')||!g('greet')||!(g('desc')||Object.keys(f).length))return toast('Нужны имя, приветствие и хоть какое-то описание');
  const o={id:V.eid||'u'+Date.now(),mine:1,name:g('name'),av:V.img||g('av')||'🙂',tag:g('tag')||'Свой персонаж',cat:g('cat')||'Свои',desc:g('desc'),greet:g('greet'),scenario:g('scenario'),example:g('example'),f,set:{len:$('#f_len').value,pov:$('#f_pov').value,temp:g('temp')}};
  const i=S.mine.findIndex(x=>x.id===o.id);i<0?S.mine.unshift(o):S.mine[i]=o;save();toast('Сохранено');open(o.id)}
 else if(d.act==='delc'){if(confirm('Удалить персонажа и его чат?')){S.mine=S.mine.filter(x=>x.id!==V.eid);delete S.chats[V.eid];save();go('home',{eid:null})}}
 else if(d.act==='share'){const o={...find(V.eid)};delete o.id;delete o.mine;if(/^data:/.test(o.av))o.av='🙂';
  navigator.clipboard.writeText(location.href.split('#')[0]+'#c='+btoa(unescape(encodeURIComponent(JSON.stringify(o)))));toast('Ссылка скопирована')}
 else if(d.act==='saves'){S.key=$('#s_key').value.trim();S.model=$('#s_model').value.trim()||'deepseek-chat';S.url=$('#s_url').value.trim();S.temp=$('#s_temp').value;if($('#s_adult').checked&&!S.adult&&!confirm('Подтверждаете, что вам исполнилось 18 лет?'))$('#s_adult').checked=false;S.npc=$('#s_npc').checked;S.adult=$('#s_adult').checked;S.me={name:$('#s_name').value.trim(),about:$('#s_about').value.trim()};const p=$('#s_prompt').value.trim();S.prompt=p===DP?'':p;save();toast('Сохранено')}
 else if(d.act==='resetp'){S.prompt='';save();render()}
 else if(d.act==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,key:''})],{type:'application/json'}));a.download='polychat-backup.json';a.click()}
 else if(d.act==='imp'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());delete o.key;Object.assign(S,o);save();toast('Импортировано');render()}catch{toast('Неверный файл')}};i.click()}
});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.id==='s_prov'&&PROV[el.value]){const p=PROV[el.value];$('#s_url').value=p.u;$('#s_model').value=p.m;$('#s_key').value='';$('#ph').innerHTML=p.h}
 if(el.id==='f_file'&&el.files[0]){const v=await thumb(el.files[0]);if(v){V.img=v;toast('Фото загружено')}}
 if(el.id==='up'){let n=0;
  for(const f of el.files){try{let j,av=null;
   if(/\.png$/i.test(f.name)){j=await pngCard(f);av=await thumb(f)}else j=JSON.parse(await f.text());
   for(const x of Array.isArray(j)?j:j.chars||[j])if(x&&(x.name||x.data?.name)){S.mine.unshift(norm(x,av));n++}}catch{}}
  el.value='';save();toast(n?'Загружено персонажей: '+n:'Не удалось прочитать файл');if(n)go('home',{cat:'Мои'})}
});
document.addEventListener('keydown',e=>{if(e.target.id==='txt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.addEventListener('input',e=>{
 if(e.target.id==='txt'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'}
 if(e.target.id==='q'){V.q=e.target.value;V.p==='home'?render():go('home')}
});
if(location.hash.startsWith('#c=')){try{const o=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));if(o.name&&confirm('Добавить персонажа «'+o.name+'»?')){o.id='u'+Date.now();o.mine=1;S.mine.unshift(o);save()}}catch{}history.replaceState(0,'',location.pathname)}
render();
</script></body></html>
